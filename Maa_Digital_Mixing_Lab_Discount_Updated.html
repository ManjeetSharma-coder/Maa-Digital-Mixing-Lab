<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import{getFirestore,doc,setDoc,getDoc,getDocs,collection,query,where,updateDoc,addDoc,increment,orderBy,limit}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import{getAuth,onAuthStateChanged,signInWithEmailAndPassword,sendPasswordResetEmail,sendSignInLinkToEmail,isSignInWithEmailLink,signInWithEmailLink,signOut,GoogleAuthProvider,signInWithPopup,RecaptchaVerifier,signInWithPhoneNumber}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

var rows=function(s){return s.docs.map(function(d){return d.data()})};
window.FBX={
put:function(b){return setDoc(doc(db,"bookings",b.id),b)},
get:async function(id){var s=await getDoc(doc(db,"bookings",id));return s.exists()?s.data():null},
upd:function(id,o){return updateDoc(doc(db,"bookings",id),o)},
mine:async function(em){return rows(await getDocs(query(collection(db,"bookings"),where("email","==",em))))},
all:async function(){return rows(await getDocs(collection(db,"bookings")))},
list:async function(c){var s=await getDocs(query(collection(db,c),orderBy("ts","desc"),limit(100)));return s.docs.map(function(d){var x=d.data();x._id=d.id;return x})},
pubReviews:async function(){var s=await getDocs(query(collection(db,"ratings"),where("show","==",true),limit(30)));return s.docs.map(function(d){var x=d.data();x._id=d.id;return x})},
setShow:function(id,v){return updateDoc(doc(db,"ratings",id),{show:v})},
visits:async function(){var s=await getDoc(doc(db,"stats","visits"));return s.exists()?s.data().count:0},
pubRating:async function(){var s=await getDoc(doc(db,"stats","ratings"));return s.exists()?s.data():{count:0,sum:0}},
addRating:async function(n){var r=doc(db,"stats","ratings"),s=await getDoc(r);if(s.exists())await updateDoc(r,{count:increment(1),sum:increment(n)});else await setDoc(r,{count:1,sum:n})},
visit:async function(){var r=doc(db,"stats","visits"),s=await getDoc(r).catch(function(){return null});if(s&&s.exists())await updateDoc(r,{count:increment(1)});else await setDoc(r,{count:1})},
add:function(c,o){return addDoc(collection(db,c),o)},
login:function(e,p){return signInWithEmailAndPassword(au,e,p)},
googleLogin:function(){return signInWithPopup(au,new GoogleAuthProvider())},
phoneStart:function(number){if(window.__mdlRecaptcha){try{window.__mdlRecaptcha.clear()}catch(e){}}window.__mdlRecaptcha=new RecaptchaVerifier(au,"recaptcha-container",{size:"normal"});return signInWithPhoneNumber(au,number,window.__mdlRecaptcha)},
reset:function(e){return sendPasswordResetEmail(au,e)},
link:function(e,u){return sendSignInLinkToEmail(au,e,{url:u,handleCodeInApp:true})},
isLink:function(u){return isSignInWithEmailLink(au,u)},
done:function(e,u){return signInWithEmailLink(au,e,u)},
out:function(){return signOut(au)},
on:function(f){return onAuthStateChanged(au,f)}}}}catch(e){window.FBX=null}
window.dispatchEvent(new Event("fbready"));
</script>

function bcard(b){var h='<div class="fn"><b>'+esc(b.id)+'</b> <span class="st">'+esc(kind(b)=="pend"?"Payment to verify":kind(b))+"</span>"+tl(b)+"<p><b>"+esc(b.name)+"</b> \u2022 "+esc(b.ev)+"<br>+"+esc(b.cc)+" "+esc(b.ph)+" \u2022 "+esc(b.email)+"<br>"+esc(b.addr)+"</p><p>"+b.fns.map(function(f){return esc(f.n)+" ("+f.dt+")"}).join(", ")+'</p><div class="row"><span>Total</span><b>'+fmt(b.tot)+'</b></div><div class="row"><span>Paid</span><b>'+fmt(b.paid)+"</b></div>";
 h+='<div class="two"><a class="p s" href="tel:+'+esc(b.cc)+esc(b.ph)+'">Call</a><a class="p s" href="mailto:'+esc(b.email)+'">Email</a></div>';
 if(b.st=="req")h+='<label>Final total (₹)</label><input id="ft_'+b.id+'" type="number" value="'+b.tot+'"><label>Amount customer pays now (₹)</label><input id="am_'+b.id+'" type="number" value="'+Math.round(b.tot/2)+'"><div class="two"><button class="p g" onclick="aAccept(\''+b.id+'\')">Accept</button><button class="p k" onclick="aReject(\''+b.id+'\')">Reject</button></div>';
 if(b.st=="pending_verification")h+='<p class="msg">Customer says paid '+fmt(b.claimed)+", UPI Ref "+esc(b.utr)+'. Check your bank/UPI app first.</p><button class="p g" onclick="aVerify(\''+b.id+'\')">Payment received - Confirm</button>';
 if(b.st=="paid"){h+='<button class="p s" onclick="aBalance(\''+b.id+'\')">Ask for balance payment ('+fmt(b.tot-b.paid)+')</button><button class="p g" onclick="aComplete(\''+b.id+'\')">Booking Completed</button>'}
 return h+'<button class="p s" onclick="dl2(\''+b.id+'\')">Download Your Bill</button></div>'}
function dl2(id){var b=S.cache.filter(function(x){return x.id==id})[0];if(b)receipt(b)}
function aGet(id){return S.cache.filter(function(x){return x.id==id})[0]}
async function aSave(b,subj,note,msg){await DB.put(b);notify(b,subj,note);load("admin");popup("Saved. Customer and owners notified.",null,{s:"To also send this message to the customer on WhatsApp, tap the green button and then tap Open.",btns:[{label:"Send Message to Customer on WhatsApp",c:"g",fn:function(){wa(b.cc+b.ph,msg)}},{label:"Download Your Bill",fn:function(){receipt(b)}}]})}
async function aAccept(id){var b=aGet(id),ft=Number($("ft_"+id).value),am=Number($("am_"+id).value);if(!(ft>0)||!(am>0)||am>ft)return alert("Enter valid total and advance amount.");
 b.tot=ft;b.amt=am;b.st="acc";await aSave(b,"Booking accepted - Maa Digital Mixing Lab","Your booking is accepted. "+THANKS+" Please pay "+fmt(am)+" here: "+BASEURL+"#pay="+id,"Hello "+b.name+", your booking "+id+" with Maa Digital Mixing Lab is *ACCEPTED*. "+THANKS+" Total "+fmt(ft)+". Please pay "+fmt(am)+" to confirm: "+BASEURL+"#pay="+id)}
async function aReject(id){var b=aGet(id);b.st="rej";await aSave(b,"Booking update - Maa Digital Mixing Lab","Sorry, we cannot take this booking for these dates. Please call 8051400941.","Hello "+b.name+", sorry, we cannot take booking "+id+" for these dates. Please call 8051400941.")}
async function aVerify(id){var b=aGet(id);b.paid=(b.paid||0)+b.claimed;b.claimed=0;b.st="paid";await aSave(b,"Payment received - booking confirmed","Thank you! We received your payment. Your booking is confirmed.","Hello "+b.name+", we received your payment of "+fmt(b.paid)+". Booking "+id+" is *CONFIRMED*. Thank you! - Maa Digital Mixing Lab")}
async function aBalance(id){var b=aGet(id);b.amt=b.tot-b.paid;b.st="acc";await aSave(b,"Balance payment - Maa Digital Mixing Lab","Please pay the balance "+fmt(b.amt)+" here: "+BASEURL+"#pay="+id,"Hello "+b.name+", balance payment "+fmt(b.amt)+" for booking "+id+": "+BASEURL+"#pay="+id)}
async function aComplete(id){var b=aGet(id);b.st="done";await aSave(b,"Your work is completed - Maa Digital Mixing Lab","Your work is completed. Thank you for choosing us! Please rate us on our website.","Hello "+b.name+", your work for booking "+id+" is *COMPLETED*. Thank you for choosing Maa Digital Mixing Lab!")}
function adminHTML(){if(!isAdmin()){S.view="login";S.lrole="admin";return loginHTML()}var l=S.cache||[],c=function(f){return l.filter(f).length},tab=S.tab,h="";
 h+='<div class="card"><h2>Admin</h2><div class="stat"><div><b>'+l.length+'</b>Total</div><div><b>'+c(function(b){return b.st=="req"})+'</b>Requests</div><div><b>'+c(function(b){return b.st=="acc"||b.st=="pending_verification"||b.st=="paid"})+'</b>Processing</div><div><b>'+c(function(b){return b.st=="done"})+'</b>Completed</div><div><b>'+c(function(b){return b.st=="rej"})+'</b>Rejected</div><div><b>'+(S.x.visits||0)+"</b>Total visits</div></div></div>";
 if(S.err)h+='<p class="err">'+S.err+"</p>";
 var sel={req:function(b){return b.st=="req"},proc:function(b){return["acc","pending_verification","paid"].indexOf(b.st)>=0},done:function(b){return b.st=="done"},all:function(){return true}}[tab];
 if(sel){h+='<div class="card"><h2>'+{req:"Booking Requests",proc:"Booking Processing",done:"Booking Completed",all:"Full History"}[tab]+"</h2>"+(l.filter(sel).sort(function(a,b){return b.ts-a.ts}).map(bcard).join("")||"<p class='mu'>Nothing here.</p>")+"</div>"}
 else if(tab=="dates"){var d=[];l.forEach(function(b){if(["acc","pending_verification","paid"].indexOf(b.st)>=0)b.fns.forEach(function(f){if(f.dt>=TODAY)d.push([f.dt,f.n,b.name,b.ph])})});d.sort();h+='<div class="card"><h2>Upcoming Work Dates</h2>'+(d.map(function(r){return'<div class="row"><span>'+r[0]+" \u2022 "+esc(r[1])+"</span><span>"+esc(r[2])+" "+esc(r[3])+"</span></div>"}).join("")||"<p class='mu'>No upcoming confirmed work.</p>")+"</div>"}
 else if(tab=="stats"){h+='<div class="card"><h2>Visitors</h2><p class="big">'+(S.x.visits||0)+' visits so far</p></div><div class="card"><h2>Ratings (real)</h2><p class="big">'+(S.x.agg&&S.x.agg.count?"\u2605 "+(S.x.agg.sum/S.x.agg.count).toFixed(1)+" / 5 from "+S.x.agg.count+" ratings":"No ratings yet")+"</p>"+((S.x.ratings||[]).map(function(r){return"<div class='fn'>"+"\u2605".repeat(r.stars||0)+" <b>"+esc(r.name)+"</b><br>"+esc(r.msg)+'<button class="p s" onclick="hideRv(\''+r._id+"',"+(r.show===false?"true":"false")+')">'+(r.show===false?"Show on website":"Hide from website")+"</button></div>"}).join("")||"<p class='mu'>No ratings yet.</p>")+"</div>"}
 else if(tab=="login"){h+='<div class="card"><h2>Login History</h2>'+((S.x.logins||[]).map(function(r){return'<div class="row"><span>'+esc(r.role)+" \u2022 "+esc(r.email)+"</span><span>"+new Date(r.ts).toLocaleString()+"</span></div>"}).join("")||"<p class='mu'>No logins yet.</p>")+"</div>"}
 return h}

 else location.href="mailto:"+CFG.MAIL+"?subject="+encodeURIComponent("Support message from "+n)+"&body="+encodeURIComponent(body)}

function snap(){var o={};["f_name","f_email","f_iso","f_ph","f_addr","rn","rm","sn","se","sm","le","ae","utr"].forEach(function(i){var e=document.getElementById(i);if(e&&e.value!=null)o[i]=e.value});return o}
function restore(o){for(var i in o){var e=document.getElementById(i);if(e&&o[i]!=="")e.value=o[i]}}
function render(){var v=S.view,h,sv=snap();
 if(sv.f_name!==undefined){S.c.name=sv.f_name;S.c.email=(sv.f_email||"").trim().toLowerCase();S.c.iso=sv.f_iso||S.c.iso;S.c.ph=sv.f_ph||"";S.c.addr=sv.f_addr||""}
 if(v=="lang")h='<div class="w">'+langHTML()+"</div>";
 else{var b=v=="home"?homeHTML()+whyHTML()+reviewsHTML():v=="book"?bookHTML():v=="sent"?sentHTML():v=="my"?myHTML():v=="login"?loginHTML():v=="alogin"?alHTML():v=="admin"?adminHTML():v=="pay"?payHTML():v=="about"?aboutHTML():v=="rate"?rateHTML():v=="support"?supportHTML():homeHTML();
  h=head()+'<div class="w">'+b+'<p class="mu" style="text-align:center;margin-top:20px">&copy; 2026 Maa Digital Mixing Lab, Begusarai, Bihar</p></div>'}
 $("app").innerHTML=h+(S.pop?popHTML():"")+(S.terms?termsHTML():"");restore(sv);document.documentElement.lang=S.lang=="hi"?"hi":"en";if(v=="book")calc()}
function route(){var h=location.hash;if(h.indexOf("#pay=")==0){S.pid=h.slice(5).replace(/[^A-Za-z0-9]/g,"");S.view="pay"}else if(h=="#admin"){S.view="login";S.lrole="admin"}}
function heal(msg,stack){errN++;if(errN>5)return;try{if(!S.view||!$("app").innerHTML)S.view="home";render()}catch(e){try{localStorage.removeItem("mb");location.reload()}catch(x){}}
 try{var e=CFG.EJ;if(e.pub&&window.emailjs)emailjs.send(e.svc,e.tplOwner,{to_email:"",subject:"Website ERROR",message:"Error: "+msg+"\n"+(stack||"")+"\nPage: "+location.href+"\nDevice: "+navigator.userAgent,html:esc(msg)},{publicKey:e.pub}).catch(function(){})}catch(x){}}
window.onerror=function(m,s,l,c,e){heal(m,e&&e.stack);return true};
window.addEventListener("unhandledrejection",function(e){heal(String(e.reason),e.reason&&e.reason.stack)});
window.addEventListener("hashchange",function(){route();render();load(S.view)});
function boot(){
 if(window.FBX){FBX.on(async function(u){if(!u){S.user=null;render();return}var em=(u.email||"").toLowerCase();var role=em===String(CFG.ADMIN_EMAIL||"").trim().toLowerCase()?"admin":"customer";S.user={uid:u.uid,email:em,role:role};render()});
  try{if(FBX.isLink(location.href)){var em=ls("loginEmail","")||prompt("Confirm your email");FBX.done(em,location.href).then(function(r){S.pop={m:"Login successful!",d:{v:"home"}};S.view="home";FBX.add("logins",{role:"customer",email:r.user.email,ua:navigator.userAgent,ts:Date.now()}).catch(function(){});history.replaceState(null,"",BASEURL);render()}).catch(function(){S.msg="Login link invalid or expired."})}}catch(e){}
  try{if(!sessionStorage.getItem("v")){sessionStorage.setItem("v","1");FBX.visit().catch(function(){})}}catch(e){}
 try{FBX.pubRating().then(function(r){S.pr=r;render()}).catch(function(){})}catch(e){}
 try{FBX.pubReviews().then(function(r){S.rv=r;render()}).catch(function(){})}catch(e){}}
 route();render();load(S.view)}
var booted=false;function boot1(){if(booted)return;booted=true;boot()}
if(window.FBX!==undefined)boot1();else{window.addEventListener("fbready",boot1);setTimeout(boot1,3500)}
